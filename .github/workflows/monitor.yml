# Monitoreo programado: disponibilidad, tiempos de respuesta y errores HTTP.
# Guarda el historial en monitoring/metrics.csv y vuelve a publicar /estado/.
# Requiere la variable del repositorio SITE_URL (Settings > Secrets and variables > Actions > Variables).
name: Monitoreo del sitio

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar el sitio
        id: check
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/monitor.py
      - name: Guardar métricas en el repositorio
        run: |
          git config user.name "eke-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add monitoring/metrics.csv
          git diff --cached --quiet || git commit -m "chore(monitor): actualizar métricas"
          git push
      - name: Volver a publicar para actualizar /estado/
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Fallar si el sitio no respondió (dispara notificación)
        if: steps.check.outcome == 'failure'
        run: exit 1
